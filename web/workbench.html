<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMY262 Workbench</title>
<style>
/* AdLib Tracker II's blue (as the FM-1's screen and the installer): a pale blue by day, the DOS blue with cyan and
   yellow by night */
:root {
  --bg: #eef1ff; --panel: #ffffff; --ink: #0b1450; --dim: #3b4685; --line: #c9d0f2;
  --accent: #0000aa; --accent-ink: #ffffff; --ok: #1d7a3a; --bad: #b3261e; --bar: #dde2fb; --hi: #b36b00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000080; --panel: #00009a; --ink: #e8eaff; --dim: #a9b1f0; --line: #2a2fb0;
    --accent: #55ffff; --accent-ink: #000060; --ok: #55ff55; --bad: #ff8a80; --bar: #0000c8; --hi: #ffff55;
  }
}
:root[data-theme="dark"] {
  --bg: #000080; --panel: #00009a; --ink: #e8eaff; --dim: #a9b1f0; --line: #2a2fb0;
  --accent: #55ffff; --accent-ink: #000060; --ok: #55ff55; --bad: #ff8a80; --bar: #0000c8; --hi: #ffff55;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
header { max-width: 980px; margin: 0 auto; padding: 20px 16px 0; }
h1 { font: 700 22px/1.2 ui-monospace, Menlo, monospace; margin: 0; letter-spacing: .02em; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
#lang { border: 0; background: none; padding: 4px 0; color: var(--dim); font-size: 13px; text-decoration: underline; }
.sub { color: var(--dim); margin: 4px 0 14px; }
nav { display: flex; gap: 4px; border-bottom: 3px double var(--accent); flex-wrap: wrap; }
nav button { border: 0; border-radius: 0; background: none; padding: 8px 14px; color: var(--dim); font: 600 14px/1.4 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .04em; }
nav button[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); }
main { max-width: 980px; margin: 0 auto; padding: 16px 16px 48px; }
section[hidden] { display: none; }
.frame { width: 100%; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); display: block; }
#emuFrame { height: 760px; }
#instFrame { height: 900px; }
.note { color: var(--dim); font-size: 13px; margin: 8px 0 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 2px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); color: var(--ink); }
#status { color: var(--dim); }
#status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
.slots { margin-top: 16px; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); }
.slot { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.slot:first-child { border-top: 0; }
.slot.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.num { font: 700 24px/1 ui-monospace, Menlo, monospace; color: var(--hi); text-align: center; }
.name { font: 600 16px/1.3 ui-monospace, Menlo, monospace; }
.meta { color: var(--dim); font-size: 13px; }
.empty .name { color: var(--dim); font-weight: 400; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.acts button { padding: 4px 10px; font-size: 13px; }
.prog { height: 4px; background: var(--bar); border-radius: 2px; margin-top: 6px; overflow: hidden; display: none; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
#log { margin-top: 16px; font: 13px/1.5 ui-monospace, Menlo, monospace; color: var(--dim); white-space: pre-wrap; }
.help p { margin: 0 0 10px; }
.help code { font: 13px ui-monospace, Menlo, monospace; }
@media (max-width: 560px) { .slot { grid-template-columns: 32px 1fr; } .acts { grid-column: 1 / -1; justify-content: flex-start; } #emuFrame { height: 640px; } }
</style>
</head>
<body>
<header>
  <div class="top"><h1>FMY262 Workbench</h1><button type="button" id="lang"></button></div>
  <p class="sub" data-i18n="sub"></p>
  <nav role="tablist">
    <button role="tab" data-tab="run" data-i18n="tabRun"></button>
    <button role="tab" data-tab="songs" data-i18n="tabSongs"></button>
    <button role="tab" data-tab="install" data-i18n="tabInstall"></button>
    <button role="tab" data-tab="help" data-i18n="tabHelp"></button>
  </nav>
</header>
<main>
  <section id="tab-run">
    <iframe id="emuFrame" class="frame" title="FMY262 emulator" allow="midi; autoplay"></iframe>
    <p class="note" data-i18n="runNote"></p>
  </section>

  <section id="tab-songs" hidden>
    <div class="row">
      <label><span data-i18n="target"></span> <select id="target"><option value="emu" data-i18n="targetEmu"></option><option value="usb" data-i18n="targetUsb"></option></select></label>
      <button id="connect" class="primary" data-i18n="connect"></button>
      <button id="refresh" disabled data-i18n="refresh"></button>
    </div>
    <p id="status" class="note"></p>
    <div class="slots" id="slots"></div>
    <div id="log"></div>
  </section>

  <section id="tab-install" hidden>
    <iframe id="instFrame" class="frame" title="FMY262 installer" allow="midi"></iframe>
    <p class="note" data-i18n="installNote"></p>
  </section>

  <section id="tab-help" class="help" hidden>
    <p data-i18n-html="help1"></p>
    <p data-i18n-html="help2"></p>
    <p data-i18n-html="help3"></p>
    <p data-i18n-html="help4"></p>
    <p data-i18n-html="help5"></p>
  </section>
</main>

    needSiteEmu: '에뮬레이터는 사이트로 열어야 합니다: npm run workbench 후 npm run serve.',
    whoEmu: '브라우저의 FMY262', whoUsb: 'FM-1',
    busy: '{who}가 재생 중입니다: 재생을 멈춘 뒤 다시 해 주세요.', failed: '실패: {e}',
    waitEmu: '에뮬레이터를 기다리는 중… (실행 탭이 켜지는 데 몇 초)',

    askDelete: '슬롯 {k}의 곡({name})을 지울까요? 되돌릴 수 없습니다.', deleted: '슬롯 {k}의 곡을 지웠습니다.',
    tooBig: '{what}: {n} 바이트라 슬롯({room})에 들어가지 않습니다.',
    askSend: '{what} → 슬롯 {k}', over: ' (지금 있는 곡 {name} 위에 덮어씁니다)', cut: '\n\n잘리는 것:\n· {list}', sendQ: '\n\n보낼까요?',
    sending: '보내는 중: {what}…',
    sent: '슬롯 {k}에 {name} 곡을 보냈습니다. {who2}에서 SAVE → 슬롯 → SEL로 불러오세요.', who2Emu: '브라우저의 FMY262', who2Usb: 'FM-1',

let lang = 'en';
try { if (localStorage.getItem('fmy262-wb-lang') === 'ko') lang = 'ko'; } catch (e) {}
const T = (k, v = {}) => TEXT[lang][k].replace(/\{(\w+)\}/g, (m, n) => n in v ? v[n] : m);
let lastStatus = ['pickTarget', {}, ''];
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = T(e.dataset.i18nHtml); });
  $('#lang').textContent = T('other'); $('#lang').lang = lang === 'en' ? 'ko' : 'en';
  const f = $('#instFrame'); if (f.contentWindow && f.src) f.contentWindow.postMessage({ lang }, location.origin);
  status(...lastStatus); draw();
}
$('#lang').onclick = () => { lang = lang === 'en' ? 'ko' : 'en'; try { localStorage.setItem('fmy262-wb-lang', lang); } catch (e) {} applyLang(); };

/* ---- tabs: the emulator and the installer load when first shown, and keep running while hidden */
function show(t) {
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== 'tab-' + t; });
  if (t === 'run' && !$('#emuFrame').src) $('#emuFrame').src = onSite ? 'emu/index.html' : 'about:blank';
  if (t === 'install' && !$('#instFrame').src) $('#instFrame').src = onSite ? 'install/index.html?lang=' + lang : 'about:blank';
  if (!onSite && (t === 'run' || t === 'install')) status('needSite', {}, 'bad');
  try { localStorage.setItem('fmy262-wb-tab', t); } catch (e) {}
  if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);   /* (a link can open a tab: …/#install) */
}
const TABS = ['run', 'songs', 'install', 'help'];
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h)) show(h); });
document.querySelectorAll('nav button').forEach(b => { b.onclick = () => show(b.dataset.tab); });

/* status(key, vars, kind): kept, to be said again in the other language */
function status(k, v, kind) { lastStatus = [k, v || {}, kind || '']; const e = $('#status'); e.textContent = T(k, v); e.className = 'note ' + (kind || ''); }
function log(t) { $('#log').textContent = t + '\n' + $('#log').textContent.split('\n').slice(0, 12).join('\n'); }
const who = () => T($('#target').value === 'emu' ? 'whoEmu' : 'whoUsb');
function say(e) {
  const busy = e && e.code === 'busy';
  if (busy) status('busy', { who: who() }, 'bad'); else status('failed', { e: e && e.message || e }, 'bad');
}
function download(bytes, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileName = s => (s || 'song').trim().replace(/[^A-Za-z0-9 _-]+/g, '').replace(/\s+/g, '_').slice(0, 24) || 'song';
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---- connecting: the emulator through its port part (BroadcastChannel), the FM-1 through Web MIDI */
async function connect() {
  const emu = $('#target').value === 'emu';
  if (comp) { comp.close(); comp = null; }
  slots = []; draw();
  try {
    let access;
    if (emu) {
      if (!onSite) return status('needSiteEmu', {}, 'bad');
      show('run'); show('songs');           /* (the emulator loads in its tab) */
      access = emuAccess();
      status('waitEmu');
      for (let i = 0; i < 40 && !access.inputs.size; i++) await wait(250);
    } else {
      if (!navigator.requestMIDIAccess) return status('noMidi', {}, 'bad');
      status('finding');
      access = await navigator.requestMIDIAccess({ sysex: true });
    }
    const found = (await findCompanions(access)).filter(f => /^FMY262/.test(f.hello.name) && (emu ? String(f.input.id).startsWith('fm1-emu-') : !String(f.input.id).startsWith('fm1-emu-')));
    if (!found.length) return status(emu ? 'noEmu' : 'noDev', {}, 'bad');
    const f = found[0];
    comp = new Companion(f.input, f.output, { timeout: emu ? 2000 : 1000 });
    status('connected', { name: f.hello.name, ver: f.hello.appVersion, where: emu ? T('browser') : f.hello.identity }, 'ok');
    $('#refresh').disabled = false;
    const lost = e => { if (e.port && e.port.state === 'disconnected' && (e.port === f.input || e.port === f.output)) { comp = null; $('#refresh').disabled = true; status('lostConn', {}, 'bad'); draw(); } };
    if (access.addEventListener) access.addEventListener('statechange', lost); else access.onstatechange = lost;
    await refresh();
  } catch (e) { say(e); }
}

/* the list: each file's size, and the name from its head (bytes 5..24) */
async function refresh() {
  if (!comp) return;
  try {
    const files = await comp.files();
    slots = [];
    for (const f of files) {
      const s = { index: f.index, file: f.name, size: f.size, room: f.room };
      if (f.size) {
        const [st, b] = await comp.fileOp(1, f.index, [5, 0, 0, 0, 20, 0]);
        if (!st) s.name = String.fromCharCode(...b.subarray(4)).replace(/\0.*$/s, '');
      }
      slots.push(s);
    }
    draw();
  } catch (e) { say(e); }
}

function draw() {
  const box = $('#slots');
  box.innerHTML = '';
  const list = slots.length ? slots : [0, 1, 2, 3].map(i => ({ index: i, size: 0, off: true }));
  for (const s of list) {
    const el = document.createElement('div');
    el.className = 'slot' + (s.size ? '' : ' empty');
    el.innerHTML = `<div class="num">${s.index + 1}</div>
      <div><div class="name"></div><div class="meta"></div><div class="prog"><i></i></div></div>
      <div class="acts"></div>`;
    el.querySelector('.name').textContent = s.off ? '—' : s.size ? (s.name || T('noName')) : T('empty');
    el.querySelector('.meta').textContent = s.size ? T('bytes', { n: s.size.toLocaleString(), file: s.file }) : '';
    const acts = el.querySelector('.acts'), on = !!comp && !s.off;
    const btn = (t, f, en = true) => { const b = document.createElement('button'); b.textContent = t; b.disabled = !on || !en; b.onclick = () => f(s, el); acts.append(b); };
    btn(T('bImport'), pick);
    btn(T('bA2M'), saveA2M, !!s.size);
    btn(T('bFmy'), saveFmy, !!s.size);
    btn(T('bDelete'), remove, !!s.size);
    el.ondragover = e => { if (on) { e.preventDefault(); el.classList.add('drop'); } };
    el.ondragleave = () => el.classList.remove('drop');
    el.ondrop = e => { e.preventDefault(); el.classList.remove('drop'); if (on && e.dataTransfer.files[0]) sendFile(s, el, e.dataTransfer.files[0]); };
    box.append(el);
  }
}

function progress(el, a, n) { const p = el.querySelector('.prog'); p.style.display = a < n ? 'block' : 'none'; p.querySelector('i').style.width = (100 * a / n) + '%'; }
async function readSong(s, el) { return comp.read(s.index, (a, n) => progress(el, a, n)); }

async function saveA2M(s, el) {
  try {
    const song = fmyRead(await readSong(s, el));
    download(exportA2M(song), fileName(song.name) + '.a2m');
    status('savedA2M', { k: s.index + 1 }, 'ok');
  } catch (e) { say(e); }
}
async function saveFmy(s, el) {
  try {
    download(await readSong(s, el), fileName(s.name) + '.fmy');
    status('savedFmy', { k: s.index + 1 }, 'ok');
  } catch (e) { say(e); }
}
async function remove(s) {
  if (!confirm(T('askDelete', { k: s.index + 1, name: s.name || T('noName') }))) return;
  try { await comp.remove(s.index); status('deleted', { k: s.index + 1 }, 'ok'); await refresh(); } catch (e) { say(e); }
}
function pick(s, el) {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.a2m,.rad,.fmy';
  i.onchange = () => i.files[0] && sendFile(s, el, i.files[0]);
  i.click();
}

/* a file from the computer: an A2M turned into FMY1 here, an .fmy checked */
async function sendFile(s, el, file) {
  try {
    const raw = new Uint8Array(await file.arrayBuffer()), warn = [];
    let song;
    if (String.fromCharCode(...raw.subarray(0, 4)) === 'FMY1') song = fmyRead(raw);
    else { const r = isRAD(raw) ? importRAD(raw) : importA2M(raw); song = r.song; if (r.warn && r.warn.length) warn.push(...r.warn); }
    if (!song.name) song.name = file.name.replace(/\.[^.]*$/, '');
    await sendSong(s, el, song, warn, file.name);
  } catch (e) { progress(el, 1, 1); say(e); }
}
async function sendSong(s, el, song, warn, what) {
  try {
    const w = fmyWrite(song);
    warn = warn.concat(w.warn);
    if (w.bytes.length > (s.room || ROOM)) return status('tooBig', { what, n: w.bytes.length.toLocaleString(), room: (s.room || ROOM).toLocaleString() }, 'bad');
    const msg = T('askSend', { what, k: s.index + 1 }) + (s.size ? T('over', { name: s.name || '' }) : '') + (warn.length ? T('cut', { list: warn.join('\n· ') }) : '') + T('sendQ');
    if (!confirm(msg)) return;
    status('sending', { what });
    await comp.write(s.index, w.bytes, (a, n) => progress(el, a, n));
    progress(el, 1, 1);
    status('sent', { k: s.index + 1, name: fmyName(song.name, 20), who2: T($('#target').value === 'emu' ? 'who2Emu' : 'who2Usb') }, 'ok');
    log(T('logSent', { what, n: w.bytes.length, file: s.file }) + (warn.length ? T('logCut', { list: warn.join(', ') }) : ''));
    await refresh();
  } catch (e) { progress(el, 1, 1); say(e); }
}

$('#connect').onclick = connect;
$('#refresh').onclick = refresh;
$('#target').onchange = () => { if (comp) { comp.close(); comp = null; } slots = []; $('#refresh').disabled = true; draw(); status('targetChanged'); };
applyLang();
let first = 'run';
try { first = localStorage.getItem('fmy262-wb-tab') || 'run'; } catch (e) {}
if (!onSite) { $('#target').value = 'usb'; first = 'songs'; }
if (TABS.includes(location.hash.slice(1))) first = location.hash.slice(1);
show(first);
</script>
